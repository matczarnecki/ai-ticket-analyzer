services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-ticket-analyzer-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        ollama serve &
        server_pid=$$!
        until ollama list >/dev/null 2>&1; do
          sleep 2
        done
        ollama show qwen3:8b >/dev/null 2>&1 || ollama pull qwen3:8b
        ollama show mxbai-embed-large >/dev/null 2>&1 || ollama pull mxbai-embed-large
        wait $$server_pid
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg18-trixie
    environment:
      POSTGRES_DB: ticket_analyzer
      POSTGRES_USER: ticket_analyzer
      POSTGRES_PASSWORD: local_dev_password
    ports:
      - "5432:5432"
    volumes:
      - ticket-analyzer-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_analyzer -d ticket_analyzer"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ollama_data:
  ticket-analyzer-postgres-data:
