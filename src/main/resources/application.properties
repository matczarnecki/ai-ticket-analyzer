spring.application.name=ai-ticket-analyzer

management.endpoints.web.exposure.include=health,info,metrics

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen3:8b
spring.ai.ollama.chat.temperature=0.2
spring.ai.retry.max-attempts=3
spring.ai.retry.backoff.initial-interval=1s
spring.ai.retry.backoff.multiplier=2
spring.ai.retry.backoff.max-interval=5s

spring.ai.chat.observations.log-prompt=true
spring.ai.chat.observations.log-completion=true
logging.level.org.springframework.ai.chat.client.advisor.StructuredOutputValidationAdvisor=DEBUG